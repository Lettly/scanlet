name: Scanlet Bridge
version: "1.2.1"
slug: scanlet_bridge
description: Run the Scanlet scanning bridge on your network, and scan from a printer
url: https://github.com/Lettly/scanlet/tree/main/scanlet_bridge
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
# The bridge has to speak mDNS to advertise itself and to find scanners, and it
# has to reach printers wherever they are on the network. Both need the host's
# network namespace.
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:scanner
panel_title: Scanlet
options:
  printers: []
  advertise: true
schema:
  printers:
    - str
  advertise: bool
