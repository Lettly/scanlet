name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bridge end-to-end tests (mock eSCL scanner)
        run: node bridge/test/bridge.test.mjs

      - name: Extension printer-layer tests
        run: node extension/test/escl.test.mjs

      - name: Extension message-protocol tests
        run: node extension/test/messaging.test.mjs

      - name: Home Assistant add-on tests
        run: node scanlet_bridge/test/addon.test.mjs

      - name: The extension package is submittable
        run: node tools/build-extension.mjs --check

      - name: vendor/ matches its manifest
        run: node tools/vendor.mjs --check

      - name: Every module parses
        run: |
          for file in assets/js/*.js extension/src/*.js sw.js; do
            node --check "$file" || exit 1
          done
        shell: bash
